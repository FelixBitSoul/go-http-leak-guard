services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "8080:8080"
    networks:
      - leak-guard-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080 || curl --fail --silent http://localhost:8080"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  vulnerable-client:
    build:
      context: .
      dockerfile: examples/vulnerable/Dockerfile
    depends_on:
      server:
        condition: service_healthy
    networks:
      - leak-guard-network
    environment:
      - SERVER_URL=http://server:8080
    restart: unless-stopped

networks:
  leak-guard-network:
    driver: bridge
